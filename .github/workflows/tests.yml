name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    name: windows-python-${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run regression tests
        shell: pwsh
        run: python test_enhance_hotkey.py

      - name: Validate release packages
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: python test_release.py

  plugin:
    runs-on: windows-latest
    name: dsh-plugin
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install --registry=https://registry.npmjs.org

      - name: Check generated tier rules, typecheck and build
        run: npm run build

      - name: Run unit tests
        run: npm test
